packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

overrides:
  react: "19.3.0"
  react-dom: "19.3.0"
  react-native: "0.88.1"
  "@op-engineering/op-sqlite": "18.2.5"

peerDependencyRules:
  allowedVersions:
    "@typeonce/effect-machine-react>scheduler": "0.28.0"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

ignoredBuiltDependencies:
  - dtrace-provider
  - msgpackr-extract

allowBuilds:
  "@shopify/react-native-skia": true
  better-sqlite3: true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
