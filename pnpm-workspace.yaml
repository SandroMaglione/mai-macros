packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

ignoredBuiltDependencies:
  - dtrace-provider
  - msgpackr-extract

allowBuilds:
  "@shopify/react-native-skia": false
  better-sqlite3: true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@typeonce/effect-machine@0.1.0"
